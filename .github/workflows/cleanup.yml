---
name: Cleanup
"on":
  workflow_dispatch:
  # Run CI every 2 hours
  schedule:
    - cron: "0 */2 * * *"
jobs:
  cleanup:
    runs-on: ubuntu-latest
    name: cleanup
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    strategy:
      # Run all tests always
      fail-fast: false

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install timeago hcloud

      # Run the pre-commit hooks
      - name: Run cleanup
        run: python3 .github/clear-up-hetzner.py
