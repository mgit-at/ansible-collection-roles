---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Fix the apt sources of the Hetzner Debian 11 image
      ansible.builtin.import_tasks: ../../../../tests/molecule/hcloud_playbooks/tasks/fix_debian11_sources.yml

    - name: Mask cloud-init
      ansible.builtin.systemd_service:
        name: cloud-init
        enabled: false
        masked: true

    - name: Mask networking
      ansible.builtin.systemd_service:
        name: networking
        masked: true
