---
- name: Converge
  hosts: all
  gather_facts: true
  pre_tasks:
    # ssl_reject_handshake needs nginx >= 1.19.4, Ubuntu 22.04 and Debian 11 ship 1.18
    - name: Set vars for ssl reject handshake
      when: >-
        (ansible_distribution == 'Ubuntu' and ansible_distribution_major_version | int >= 24)
        or (ansible_distribution == 'Debian' and ansible_distribution_major_version | int >= 12)
      ansible.builtin.set_fact:
        nginx_base_ssl_reject_handshake_enabled: true
  roles:
    - role: nginx_base
      vars:
        nginx_base_pkg_variant: nginx-extras
        nginx_base_dhparam_size: 1024 # for testing purposes smaller size for speed
