---
- name: Verify
  hosts: all
  gather_facts: true
  vars:
    _nginx_config_files:
      - conf.d/connection-upgrade
      - conf.d/hash-bucket-size
      - snippets/cf-origin-pull
      - snippets/tls
      - snippets/tls-legacy
      - snippets/hsts
      - snippets/security-headers
      - snippets/proxy-nobuff
      - snippets/proxy-forward-headers
      - snippets/acmetool
  tasks:
    - name: Check if nginx is installed
      ansible.builtin.apt:
        name: "nginx-extras"
        state: present
      register: _nginx_installed
      failed_when: _nginx_installed.changed
    - name: Check if config files exist - stat
      loop: "{{ _nginx_config_files }}"
      ansible.builtin.stat:
        path: /etc/nginx/{{ item }}.conf
      register: _nginx_conf_files_result
    - name: Check if config files exist - fail
      when: not item.stat.exists
      loop: "{{ _nginx_conf_files_result.results }}"
      ansible.builtin.fail:
        msg: "Config file {{ item.item }} is missing"
    - name: Get the effective nginx config
      ansible.builtin.command: nginx -T
      register: _nginx_config_dump
      changed_when: false
    - name: Check that server_tokens is off
      ansible.builtin.assert:
        that: _nginx_config_dump.stdout is regex('(?m)^\\s*server_tokens off;')
    - name: Check if default site is removed
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: _nginx_default_site
      failed_when: _nginx_default_site.stat.exists
    - name: Check if dhparams.pem is generated
      ansible.builtin.stat:
        path: /etc/ssl/dhparams.pem
      register: _nginx_dhparams
      failed_when: not _nginx_dhparams.stat.exists
    - name: Check if nginx is started
      ansible.builtin.service:
        name: nginx
        enabled: true
        state: started
      register: _nginx_service
      failed_when: _nginx_service.changed
    # Ubuntu dropped the lua module from nginx-extras in 21.04, Debian still ships it
    - name: Check if lua module is enabled
      when: ansible_distribution == 'Debian'
      ansible.builtin.stat:
        path: /etc/nginx/modules-enabled/50-mod-http-lua.conf
      register: _nginx_lua_enabled
      failed_when: not _nginx_lua_enabled.stat.exists
    - name: Gather installed packages
      ansible.builtin.package_facts:
    - name: Check that no nginx package is from the ondrej ppa
      vars:
        _nginx_ppa_packages: >-
          {{ ansible_facts.packages | dict2items
             | selectattr('key', 'match', '^(nginx|libnginx-mod-)')
             | selectattr('value.0.version', 'search', 'deb\.sury\.org')
             | map(attribute='key') | list }}
      ansible.builtin.assert:
        that: _nginx_ppa_packages | length == 0
        fail_msg: "Packages from the ondrej ppa are installed: {{ _nginx_ppa_packages | join(', ') }}"
    - name: Check ssl-reject-handshake host
      when: not (ansible_distribution == 'Ubuntu' and ansible_distribution_major_version | int <= 22)
      ansible.builtin.uri:
        url: "https://127.0.0.1"
        method: GET
        status_code: -1
      register: _response
      failed_when: not 'unrecognized name' in _response.msg
    - name: Check ssl-reject-handshake host is not enabled where nginx is too old
      when: ansible_distribution == 'Ubuntu' and ansible_distribution_major_version | int <= 22
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default-ssl-reject-handshake
      register: _nginx_ssl_reject_link
      failed_when: _nginx_ssl_reject_link.stat.exists
