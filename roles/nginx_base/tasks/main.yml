---
# This is necessary because to generate htpasswd within ansible
- name: Install required packages
  ansible.builtin.apt:
    name:
      - python3-passlib
    state: present

# ppa:ondrej/nginx was deleted upstream in 2026-04 (last series 1.28.x, see
# https://codeberg.org/oerdnj/deb.sury.org/issues/67), so nginx comes from Ubuntu
# again. Ubuntu's nginx-extras has no lua module since 21.04 (dropped in
# https://launchpad.net/ubuntu/+source/nginx/1.18.0-6ubuntu8), so this includes
# 22.04; hosts that need lua have to use something else, e.g. openresty.
- name: Fail when the deleted ondrej nginx ppa is requested
  when: nginx_base_ondrej_repo
  ansible.builtin.fail:
    msg: ppa:ondrej/nginx no longer exists, nginx_base_ondrej_repo can't be used anymore

# ssl_reject_handshake needs nginx >= 1.19.4, Ubuntu 22.04 ships 1.18
- name: Fail when ssl_reject_handshake is enabled but the distro nginx is too old
  when:
    - nginx_base_ssl_reject_handshake_enabled
    - ansible_distribution == 'Ubuntu' and ansible_distribution_major_version | int <= 22
  ansible.builtin.fail:
    msg: >-
      nginx_base_ssl_reject_handshake_enabled needs nginx >= 1.19.4, but
      {{ ansible_distribution }} {{ ansible_distribution_version }} ships an older nginx

# before installing nginx: package scripts restart nginx, which fails on a config it doesn't support
- name: Disable ssl-reject-handshake host
  when: not nginx_base_ssl_reject_handshake_enabled
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default-ssl-reject-handshake
    state: absent
  notify: Reload nginx
  tags: ssl-reject-handshake

- name: Remove the deleted ondrej nginx ppa
  when: ansible_distribution == 'Ubuntu'
  loop:
    - sources.list.d/nginx.sources
    - sources.list.d/nginx.list
    - trusted.gpg.d/nginx.gpg
    - preferences.d/nginx
  ansible.builtin.file:
    path: /etc/apt/{{ item }}
    state: absent
  notify: Update apt cache

- name: Run handlers to update apt cache
  ansible.builtin.meta: flush_handlers

- name: Gather installed packages
  ansible.builtin.package_facts:

# Swapping the packages takes nginx down and needs care (see README), so it is not automated
- name: Fail when nginx from the deleted ondrej ppa is still installed
  when: "'deb.sury.org' in ansible_facts.packages['nginx-common'][0].version | default('')"
  ansible.builtin.fail:
    msg: >-
      nginx from ppa:ondrej/nginx is installed and gets no updates anymore;
      migrate to Ubuntu's nginx packages by hand, see the nginx_base README

- name: Install nginx
  ansible.builtin.apt:
    name: "{{ nginx_base_pkg_variant }}"
    state: present
  notify: Restart nginx

- name: Create folder for http auth files
  ansible.builtin.file:
    path: /etc/nginx/auth
    state: directory
    owner: root
    group: www-data
    mode: "0750"

- name: Ensure nginx is always restarted
  loop: "{{ nginx_base_systemd_override }}"
  community.general.ini_file:
    path: /etc/systemd/system/nginx.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
    section: "{{ item[0] }}"
    option: "{{ item[1] }}"
    value: "{{ item[2] }}"
    no_extra_spaces: true
  notify: Restart nginx

- name: Remove nginx default site
  ansible.builtin.file:
    name: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart nginx

# Debian >= 13 (off) and Ubuntu >= 26.04 (build) set server_tokens in nginx.conf, a
# second one in conf.d is a duplicate directive and nginx doesn't start. Only edit
# nginx.conf where it sets something other than off, to keep conffile changes rare.
- name: Read nginx.conf
  ansible.builtin.slurp:
    src: /etc/nginx/nginx.conf
  register: _nginx_base_nginx_conf

- name: Check whether nginx.conf sets server_tokens itself
  ansible.builtin.set_fact:
    _nginx_base_server_tokens_in_nginx_conf: >-
      {{ 'server-tokens' in nginx_base_conf_d_files
         and _nginx_base_nginx_conf.content | b64decode is regex('(?m)^\s*server_tokens\s') }}

- name: Set server_tokens off in nginx.conf
  when: _nginx_base_server_tokens_in_nginx_conf
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^(\s*)server_tokens\s+(?!off;).*$'
    line: '\1server_tokens off;'
    backrefs: true
  notify: Restart nginx

- name: Remove conf.d server_tokens duplicate
  when: _nginx_base_server_tokens_in_nginx_conf
  ansible.builtin.file:
    path: /etc/nginx/conf.d/server-tokens.conf
    state: absent
  notify: Restart nginx

- name: Install nginx config.d files
  when: nginx_base_conf_d_files | length > 0
  loop: >-
    {{ nginx_base_conf_d_files | reject('eq', 'server-tokens') | list
       if _nginx_base_server_tokens_in_nginx_conf else nginx_base_conf_d_files }}
  ansible.builtin.copy:
    src: conf.d/{{ item }}.conf
    dest: /etc/nginx/conf.d/
  notify: Restart nginx

- name: Install nginx config snippets
  when: nginx_base_snippets | length > 0
  loop: "{{ nginx_base_snippets }}"
  ansible.builtin.copy:
    src: snippets/{{ item }}.conf
    dest: /etc/nginx/snippets/
  notify: Restart nginx

- name: Install ssl-reject-handshake config
  ansible.builtin.include_tasks: ssl_reject_handshake.yml

- name: Generate Diffie-Hellman parameters
  community.crypto.openssl_dhparam:
    path: /etc/ssl/dhparams.pem
    size: "{{ nginx_base_dhparam_size }}"
  notify: Restart nginx

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Ensure nginx is started and enabled
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Include applied role
  when: applied_role_enabled | default(false)
  ansible.builtin.include_role:
    name: mgit_at.roles.applied_role
