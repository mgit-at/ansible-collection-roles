---
# Lists of versions used upstream:
# https://github.com/ansible-community/ansible-build-data

# This current set of versions corresponds to:
# the newest releases that still support ansible-core 2.16 (stable-0.9 lineage), except
# hetzner.hcloud: molecule runs on ansible-core 2.18 because hetzner.hcloud < 6 breaks on
# the Hetzner API since 2026-07-01 (no datacenter in server responses) and 6.x needs 2.18

# This file just exists for molecule, real dependencies are in galaxy.yml

collections:
  - name: ansible.posix
    version: 2.2.2
    source: https://galaxy.ansible.com
  - name: community.crypto
    version: 2.26.9
    source: https://galaxy.ansible.com
  - name: community.general
    version: 11.4.9
    source: https://galaxy.ansible.com
  - name: hetzner.hcloud
    version: 6.12.0
    source: https://galaxy.ansible.com
