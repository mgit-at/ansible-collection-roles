---
- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    # before the reboot, which would clean up /run anyway
    - name: Check that the previous ethtool-setringmax generator is gone
      ansible.builtin.stat:
        path: /etc/systemd/system-generators/ethtool-setringmax-generator
      register: _base_old_generator
      failed_when: _base_old_generator.stat.exists
    - name: Check that the unrelated generator mask is kept
      ansible.builtin.stat:
        path: /etc/systemd/system-generators/systemd-gpt-auto-generator
      register: _base_gpt_mask
      failed_when: not (_base_gpt_mask.stat.islnk | default(false) and _base_gpt_mask.stat.lnk_target == '/dev/null')
    - name: Check that no units generated by the previous version are left
      ansible.builtin.shell: >-
        find /run/systemd -maxdepth 3 -path '/run/systemd/generator*/ethtool-setringmax.service.requires/*';
        systemctl list-units --all --plain --no-legend 'ethtool-setringmax@*'
      register: _base_old_generated
      changed_when: false
      failed_when: _base_old_generated.rc != 0 or _base_old_generated.stdout | length > 0
    - name: Reboot
      ansible.builtin.reboot:
        msg: Ansible updates triggered
        # use something more elaborate than "whoami"
        test_command: systemctl is-system-running
    - name: Check system state
      ansible.builtin.command: systemctl is-system-running
      # systemctl used deliberately for functionality not in systemd module
      # noqa command-instead-of-module
      register: upgrade_host_running_result
      until: upgrade_host_running_result.rc == 0
      retries: 10
      delay: 1
      changed_when: false # Read-only command
    - name: Check service state
      ansible.builtin.command: systemctl --failed
      # systemctl used deliberately for functionality not in systemd module
      # noqa command-instead-of-module
      register: upgrade_host_failed_result
      failed_when: "'failed' in upgrade_host_failed_result.stdout"
      changed_when: false # Read-only command
