---
# Clean up the previous version of this feature (before 0c9185b): a generator in
# system-generators linked one ethtool-setringmax@<interface>.service per interface to a
# template unit. Its links in /run and the started instances stay until the next reboot,
# so remove exactly those, and only the generator file itself: the system-generators
# directory also holds other generators and masks.
- name: Find units generated by the previous version of this feature
  ansible.builtin.command: >-
    find /run/systemd -maxdepth 3
    -path '/run/systemd/generator*/ethtool-setringmax.service.requires/ethtool-setringmax@*.service'
    -lname /etc/systemd/system/ethtool-setringmax@.service
  register: _base_ethtool_old_generated
  changed_when: false
  check_mode: false

# Only the previous version had ethtool-setringmax@ instances. Also catches instances left
# as "not-found active" on hosts where an earlier cleanup removed the files but no reboot
# happened since.
- name: Find instances started by the previous version of this feature
  ansible.builtin.command: systemctl list-units --all --plain --no-legend 'ethtool-setringmax@*'
  # listing units by pattern is not possible with the systemd module
  # noqa command-instead-of-module
  register: _base_ethtool_old_instances
  changed_when: false
  check_mode: false

# before removing the template unit, while the instances are still loaded normally
- name: Stop instances of the previous version of this feature
  vars:
    _base_ethtool_old_units: >-
      {{ (_base_ethtool_old_generated.stdout_lines | map('basename')
          + _base_ethtool_old_instances.stdout_lines | map('split') | map('first'))
         | unique | list }}
  when: _base_ethtool_old_units | length > 0
  ansible.builtin.command:
    argv: "{{ ['systemctl', 'stop', '--'] + _base_ethtool_old_units }}"
  register: _base_ethtool_old_stopped
  changed_when: true
  # units that are not loaded anymore need no stopping
  failed_when:
    - _base_ethtool_old_stopped.rc != 0
    - "'not loaded' not in _base_ethtool_old_stopped.stderr"

- name: Remove the previous version of this feature
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ [base_systemd_generators_dir ~ '/ethtool-setringmax-generator', '/etc/systemd/system/ethtool-setringmax@.service']
            + _base_ethtool_old_generated.stdout_lines }}"
  register: _base_ethtool_old_removed

# runs the generators again (without the old one) and drops the stopped instances
- name: Reload systemd after removing the previous version of this feature
  when: _base_ethtool_old_removed is changed or _base_ethtool_old_stopped is changed
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Install ethtool helper
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  with_items:
    - src: ethtool-setringmax
      dest: /usr/local/lib/
      mode: "0755"
    - src: ethtool-setringmax.awk
      dest: /usr/local/lib/
      mode: "0755"
    - src: ethtool-setringmax.service
      dest: /etc/systemd/system/
      mode: "0644"
  loop_control:
    label: "{{ item.dest }}/{{ item.src }}"
  notify: Restart ethtool-setringmax service

- name: Set HW Ring Parameters for existing interfaces - enable service
  ansible.builtin.systemd:
    name: ethtool-setringmax.service
    enabled: true
    state: started
