---
dependency:
  name: galaxy
  options:
    # https://github.com/ansible/galaxy/issues/2302 - galaxy is sometimes (often?) slow to respond
    timeout: "60"
    # requirements-file: collections.yml
    # ^ This fails?!
driver:
  name: default
platforms:
  - name: uhost-ubuntu-22.04 # Jammy Jellyfish
    image: ubuntu-22.04
    server_type: cx23
  - name: uhost-ubuntu-24.04 # Noble Numbat
    image: ubuntu-24.04
    server_type: cx23
  - name: uhost-ubuntu-26.04 # Resolute Raccoon
    image: ubuntu-26.04
    server_type: cx23
  - name: uhost-debian-12 # Bookworm
    image: debian-12
    server_type: cx23
  - name: uhost-debian-13 # Trixie
    image: debian-13
    server_type: cx23
provisioner:
  name: ansible
  env:
    # molecule >= 25 no longer puts the roles directory on the roles path
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  playbooks:
    create: ../../../../tests/molecule/hcloud_playbooks/create.yml
    destroy: ../../../../tests/molecule/hcloud_playbooks/destroy.yml
verifier:
  name: ansible
