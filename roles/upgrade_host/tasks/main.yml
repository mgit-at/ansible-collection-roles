---
- name: Apt upgrade
  ansible.builtin.apt:
    upgrade: dist
    # without it hosts lacking unattended-upgrades are upgraded against stale package lists
    update_cache: true
  register: upgrade_host_apt_result
  until: upgrade_host_apt_result is not failed
  retries: 60
  delay: 5
- name: Include roles pre-reboot
  when: upgrade_host_pre_reboot_role is defined
  ansible.builtin.include_role:
    name: "{{ upgrade_host_pre_reboot_role }}"
- name: Reboot and wait until the system is running
  tags:
    # This will never be idempotent, but it makes no sense to lie about not changing state either
    - molecule-idempotence-notest
  block:
    - name: Remove the log of previous post-reboot tests
      ansible.builtin.file:
        path: "{{ upgrade_host_reboot_test_log }}"
        state: absent
    - name: Reboot
      ansible.builtin.reboot:
        msg: Ansible updates triggered
        # use something more elaborate than "whoami"; every attempt is logged,
        # the reboot module itself only reports a timeout
        test_command: >-
          s=$(systemctl is-system-running 2>&1); rc=$?;
          { echo "$(date +%T) rc=$rc state=$s";
          if [ $rc -ne 0 ]; then systemctl list-jobs --no-pager; systemctl --failed --no-pager --plain; fi; }
          >> {{ upgrade_host_reboot_test_log | quote }} 2>&1;
          exit $rc
  rescue:
    - name: Read the log of the post-reboot tests
      ansible.builtin.command: tail -n 60 {{ upgrade_host_reboot_test_log | quote }}
      register: _upgrade_host_reboot_test_log
      changed_when: false # Read-only command
      failed_when: false
      ignore_unreachable: true
    - name: Fail with the log of the post-reboot tests
      ansible.builtin.fail:
        msg: |-
          {{ ansible_failed_result.msg | default('Reboot failed') }}
          post-reboot tests ({{ upgrade_host_reboot_test_log }}, last 60 lines):
          {{ _upgrade_host_reboot_test_log.stdout | default('(not readable)', true) }}
- name: Check system state
  ansible.builtin.command: systemctl is-system-running
  # systemctl used deliberately for functionality not in systemd module
  # noqa command-instead-of-module
  register: upgrade_host_running_result
  until: upgrade_host_running_result.rc == 0
  retries: "{{ upgrade_host_system_state_retries }}"
  delay: "{{ upgrade_host_system_state_delay }}"
  changed_when: false # Read-only command
  tags:
    - check
- name: Check service state
  ansible.builtin.command: systemctl --failed
  # systemctl used deliberately for functionality not in systemd module
  # noqa command-instead-of-module
  register: upgrade_host_failed_result
  failed_when: "'failed' in upgrade_host_failed_result.stdout"
  changed_when: false # Read-only command
  tags:
    - check
- name: Run apt-get autoremove
  when: upgrade_host_apt_cleanup
  ansible.builtin.apt:
    autoremove: true
  tags:
    - cleanup
    # This will never be idempotent, but it makes no sense to lie about not changing state either
    - molecule-idempotence-notest
- name: Run apt-get autoclean
  when: upgrade_host_apt_cleanup
  ansible.builtin.apt:
    autoclean: true
  tags:
    - cleanup
    # This will never be idempotent, but it makes no sense to lie about not changing state either
    - molecule-idempotence-notest
- name: Run apt-get clean
  when: upgrade_host_apt_cleanup
  ansible.builtin.apt:
    clean: true
  tags:
    # This will never be idempotent, but it makes no sense to lie about not changing state either
    - molecule-idempotence-notest
    - cleanup
- name: Include applied role
  when: applied_role_enabled | default(false)
  ansible.builtin.include_role:
    name: mgit_at.roles.applied_role
