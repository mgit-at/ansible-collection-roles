---
bugfixes:
  - base - the ethtool-setringmax cleanup removed the whole /etc/systemd/system-generators directory, including unrelated generators and masks (e.g. a masked systemd-gpt-auto-generator). It now only removes the old ethtool-setringmax-generator and its template unit.
  - base - the ethtool-setringmax cleanup left the units generated by the old generator (links in /run/systemd/generator and started ethtool-setringmax@<interface> instances, shown as not-found until the next reboot). It now removes only the links that point to the old template unit, stops the old instances and reloads systemd.
