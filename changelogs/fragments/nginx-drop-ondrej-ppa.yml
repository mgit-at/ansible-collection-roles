---
breaking_changes:
  - nginx_base - ppa:ondrej/nginx was deleted upstream, so nginx_base no longer enables it for nginx-extras on Ubuntu >= 22.04 and fails when nginx_base_ondrej_repo is set. Existing ppa installs are downgraded to Ubuntu's nginx packages and ppa-only modules (e.g. lua) are removed. Ubuntu's nginx-extras has no lua module from 24.04 on.
deprecated_features:
  - apt_repo_ubuntu_nginx - the role fails because ppa:ondrej/nginx no longer exists.
