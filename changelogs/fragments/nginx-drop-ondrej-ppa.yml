---
breaking_changes:
  - nginx_base - ppa:ondrej/nginx was deleted upstream, so nginx_base no longer enables it for nginx-extras on Ubuntu >= 22.04 and fails when nginx_base_ondrej_repo is set. It removes the ppa source and fails while nginx from the ppa is still installed; the README describes the manual migration to Ubuntu's nginx. Ubuntu's nginx-extras has no lua module (it was dropped in 21.04), so this affects Ubuntu 22.04 as well.
  - nginx_base - fails when nginx_base_ssl_reject_handshake_enabled is set on Ubuntu <= 22.04 or Debian <= 11, whose nginx 1.18 lacks ssl_reject_handshake, and removes the enabled site when the option is off.
deprecated_features:
  - apt_repo_ubuntu_nginx - the role fails because ppa:ondrej/nginx no longer exists.
