---
- name: Create
  # Adapted from
  # https://github.com/ansible-community/molecule-hetznercloud/tree/main/molecule_hetznercloud/playbooks
  hosts: localhost
  connection: local
  gather_facts: false
  no_log: "{{ molecule_no_log }}"
  vars:
    ssh_port: 22
    ssh_user: root
    ssh_path: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/ssh_key"
    ssh_key_type: ed25519
    # tried in order when Hetzner has no capacity for a server where it placed it first
    molecule_hcloud_fallback_locations: [fsn1, nbg1, hel1]
  tasks:
    - name: Create SSH key
      community.crypto.openssh_keypair:
        path: "{{ ssh_path }}"
        type: "{{ ssh_key_type }}"
        force: true
      register: generated_ssh_key

    - name: Register the SSH key name
      ansible.builtin.set_fact:
        ssh_key_name: molecule-generated-{{ 12345 | random | to_uuid }}

    - name: Register SSH key for test instance(s)
      hetzner.hcloud.ssh_key:
        name: "{{ ssh_key_name }}"
        public_key: "{{ generated_ssh_key.public_key }}"
        api_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
        state: present

    - name: Create molecule instance(s)
      hetzner.hcloud.server:
        name: "{{ item.name }}"
        server_type: "{{ item.server_type }}"
        ssh_keys:
          - "{{ ssh_key_name }}"
        image: "{{ item.image }}"
        location: "{{ item.location | default(omit) }}"
        datacenter: "{{ item.datacenter | default(omit) }}"
        user_data: "{{ item.user_data | default(omit) }}"
        api_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
        allow_deprecated_image: true
        state: present
      register: server
      with_items: "{{ molecule_yml.platforms }}"
      async: 7200
      poll: 0

    - name: Wait for instance(s) creation to complete
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      register: hetzner_jobs
      until: hetzner_jobs.finished
      retries: 300
      with_items: "{{ server.results }}"
      # no capacity for this server type there: retried in other locations below
      failed_when:
        - hetzner_jobs is failed
        - "'resource_unavailable' not in hetzner_jobs.msg | default('')"

    - name: Reset the servers created in fallback locations
      ansible.builtin.set_fact:
        _fallback_servers: []

    - name: Retry instance(s) without capacity in other locations
      ansible.builtin.include_tasks: tasks/create_fallback.yml
      loop: "{{ hetzner_jobs.results | rejectattr('hcloud_server', 'defined') | map(attribute='item.item') | list }}"
      loop_control:
        loop_var: _platform
        label: "{{ _platform.name }}"

    # - name: Create volume(s)
    #   hcloud_volume:
    #     name: "{{ item.1.name | default(item.0.name) }}"
    #     server: "{{ item.0.name }}"
    #     location: "{{ item.1.location | default(omit) }}"
    #     size: "{{ item.1.size | default(10) }}"
    #     api_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
    #     state: "present"
    #   loop: "{{ molecule_yml.platforms|subelements('volumes', skip_missing=True)}}"
    #   register: volumes
    #   async: 7200
    #   poll: 0

    # - name: Wait for volume(s) creation to complete
    #   async_status:
    #     jid: "{{ item.ansible_job_id }}"
    #   register: hetzner_volumes
    #   until: hetzner_volumes.finished
    #   retries: 300
    #   when:
    #     - volumes is defined
    #     - volumes.changed
    #   with_items: "{{ volumes.results }}"

    # - name: Create private network(s)
    #   hcloud_network:
    #     name: "{{ item.name }}"
    #     ip_range: "{{ item.ip_range | default(omit) }}"
    #     api_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
    #     state: "present"
    #   loop: "{{ molecule_yml.platforms|molecule_get_hetznercloud_networks('networks') }}"
    #   register: networks
    #   async: 7200
    #   poll: 0

    # - name: Wait for network(s) creation to complete
    #   async_status:
    #     jid: "{{ item.ansible_job_id }}"
    #   register: hetzner_networks
    #   until: hetzner_networks.finished
    #   retries: 300
    #   when:
    #     - networks is defined
    #     - networks.changed
    #   with_items: "{{ networks.results }}"

    # - name: Create private subnetwork(s)
    #   hcloud_subnetwork:
    #     network: "{{ item.network_name }}"
    #     ip_range: "{{ item.ip|ipaddr('network/prefix') }}"
    #     network_zone: "{{ item.network_zone | default('eu-central') }}"
    #     type: "{{ item.type | default('cloud') }}"
    #     api_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
    #     state: "present"
    #   loop: "{{ molecule_yml.platforms|molecule_get_hetznercloud_networks('subnetworks') }}"
    #   register: subnetworks

    # - name: Attach Server to Subnetwork(s)
    #   hcloud_server_network:
    #     network: "{{ item.network_name }}"
    #     server: "{{ item.server_name }}"
    #     ip: "{{ item.ip|ipaddr('address') }}"
    #     api_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
    #     state: "present"
    #   loop: "{{ molecule_yml.platforms|molecule_get_hetznercloud_networks('subnetworks') }}"

    - name: Populate instance config
      ansible.builtin.set_fact:
        instance_conf: >-
          {{ instance_conf | default([]) + [{
               'instance': _server.name,
               'ssh_key_name': ssh_key_name,
               'address': _server.ipv4_address,
               'user': ssh_user,
               'port': ssh_port,
               'identity_file': ssh_path,
               'volumes': item.volumes | default({}),
               'networks': item.networks | default({}) | dict2items(key_name='name', value_name='data'),
             }] }}
      vars:
        _server: >-
          {{ (hetzner_jobs.results | selectattr('hcloud_server', 'defined') | map(attribute='hcloud_server') | list
              + _fallback_servers) | selectattr('name', 'eq', item.name) | first }}
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Dump instance config
      ansible.builtin.copy:
        content: |
          # Molecule managed
          {{ instance_conf | to_json | from_json | to_yaml }}
        dest: "{{ molecule_instance_config }}"
        mode: "0600"

    - name: Wait for SSH
      ansible.builtin.wait_for:
        port: "{{ ssh_port }}"
        host: "{{ item.address }}"
        search_regex: SSH
        delay: 10
      with_items: "{{ lookup('file', molecule_instance_config) | from_yaml }}"
