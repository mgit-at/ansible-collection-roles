---
# bullseye-security left Hetzner's internal mirror and security.debian.org after Debian 11 LTS
# ended (2026-08), but the Hetzner debian-11 image still points there, so installs fail. Use
# archive.debian.org, like the base role does.
- name: Gather the distribution of the test instance
  ansible.builtin.setup:
    gather_subset: [min]

- name: Use archive.debian.org for the security updates on Debian 11
  when:
    - ansible_distribution == 'Debian'
    - ansible_distribution_major_version == '11'
  block:
    - name: Find the apt sources of the Hetzner image
      ansible.builtin.find:
        paths: [/etc/apt, /etc/apt/sources.list.d]
        patterns: ["sources.list", "*.list", "*.sources"]
      register: _debian11_apt_sources

    - name: Point the security sources to archive.debian.org
      loop: "{{ _debian11_apt_sources.files | map(attribute='path') | list }}"
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: 'https?://(mirror\.hetzner\.(com|de)/debian/security|security\.debian\.org(/debian-security)?|deb\.debian\.org/debian-security)/?(?=\s)'
        replace: http://archive.debian.org/debian-security
