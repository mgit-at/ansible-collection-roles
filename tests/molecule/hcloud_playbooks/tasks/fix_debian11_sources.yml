---
# Hetzner's internal mirror dropped bullseye-security (Debian 11 LTS ended 2026-08), but the
# Hetzner debian-11 image still points there, so apt update fails. Use the official mirror.
- name: Gather the distribution of the test instance
  ansible.builtin.setup:
    gather_subset: [min]

- name: Use security.debian.org instead of Hetzner's mirror on Debian 11
  when:
    - ansible_distribution == 'Debian'
    - ansible_distribution_major_version == '11'
  block:
    - name: Find the apt sources of the Hetzner image
      ansible.builtin.find:
        paths: [/etc/apt, /etc/apt/sources.list.d]
        patterns: ["sources.list", "*.list", "*.sources"]
      register: _debian11_apt_sources

    - name: Point the Hetzner security mirror to security.debian.org
      loop: "{{ _debian11_apt_sources.files | map(attribute='path') | list }}"
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: 'https?://mirror\.hetzner\.(com|de)/debian/security/?'
        replace: http://security.debian.org/debian-security
